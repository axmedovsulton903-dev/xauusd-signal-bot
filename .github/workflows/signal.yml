name: XAUUSD signal

on:
  schedule:
    - cron: "*/5 * * * 0-5"   # har 5 daqiqa (yakshanba–juma, UTC). GitHub ba'zan 5–15 daqiqa kechiktiradi
  workflow_dispatch:
    inputs:
      mode:
        description: "run | etalon | chatid | dry"
        default: run

concurrency:
  group: signal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BALANCE: ${{ secrets.BALANCE }}
          SNAPSHOT_HOUR_TK: ${{ vars.SNAPSHOT_HOUR_TK }}
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          if [ "$MODE" = "run" ] && { [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; }; then
            echo "TG_TOKEN yoki TG_CHAT_ID sirlari hali qo'shilmagan — o'tkazib yuborildi."; exit 0
          fi
          case "$MODE" in
            etalon) python bot.py --etalon ;;
            chatid) python bot.py --chatid ;;
            dry)    python bot.py --dry ;;
            *)      python bot.py ;;
          esac
      - name: Holatni saqlash
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state" -q
            git pull --rebase -q && git push -q
          fi
